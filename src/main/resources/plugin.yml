name: Coldsnap
version: '1.6.0'
main: ru.pavel.coldsnap.ColdsnapPlugin
api-version: '1.21.11'
softdepend: [WorldGuard, Nexo]
description: Система холода (порт датапака Coldsnap by AuraAcorn) для Paper/Purpur
authors: [AuraAcorn, pavel]
website: https://modrinth.com/datapack/coldsnap
commands:
  coldsnap:
    description: Меню индикатора холода и статус
    usage: /coldsnap [show|hide|status|reload]
    aliases: [cs, cold]
permissions:
  coldsnap.use:
    description: Включать/выключать индикатор и смотреть статус
    default: true
  coldsnap.admin:
    description: Перезагрузка конфига
    default: op
